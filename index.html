<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON RECHARGE | Next Level</title>
  
  <!-- PWA Theme Setup -->
  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEON RECHARGE">
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #050505;
      --card-bg: rgba(18, 18, 26, 0.75);
      --neon-cyan: #00f3ff;
      --neon-purple: #9d00ff;
      --neon-green: #00ff87;
      --neon-pink: #ff00ff;
      --border-glow: rgba(0, 243, 255, 0.3);
      --text-muted: #a0aab0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    
    body { 
      background: radial-gradient(circle at top right, #1a0b2e 0%, #050505 60%);
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* App Shell */
    .app { max-width: 480px; margin: 0 auto; padding: 16px; }

    /* PWA Banner */
    #pwaInstallBanner {
      display: none; background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--neon-cyan);
      padding: 10px 16px; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 200;
    }
    .install-btn {
      background: var(--neon-cyan); color: #000; border: none; padding: 6px 14px;
      border-radius: 20px; font-weight: 900; font-size: 11px; cursor: pointer;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    /* HEADER */
    header { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 14px 0; position: sticky; top: 0; z-index: 100;
      background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(12px);
    }
    .logo { 
      font-size: 22px; font-weight: 900; letter-spacing: 1.5px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.6));
      cursor: pointer; text-transform: uppercase;
    }
    .header-icon { font-size: 18px; color: #fff; cursor: pointer; transition: 0.3s; }
    .header-icon:hover { color: var(--neon-cyan); filter: drop-shadow(0 0 8px var(--neon-cyan)); }
    
    /* BALANCE BAR */
    .balance-chip {
      background: rgba(0, 255, 135, 0.08); border: 1px solid var(--neon-green);
      color: var(--neon-green); padding: 10px 16px; border-radius: 14px;
      font-size: 13px; font-weight: 800; display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 16px; backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 255, 135, 0.15);
    }

    /* HERO BANNER */
    .hero-card {
      background: linear-gradient(135deg, rgba(20, 10, 40, 0.8), rgba(10, 10, 20, 0.9));
      border: 1px solid var(--border-glow); border-radius: 20px; padding: 20px;
      position: relative; overflow: hidden; margin-bottom: 20px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
    }
    .hero-card::after {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(0,243,255,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-title { font-size: 18px; font-weight: 900; margin-bottom: 6px; }
    .hero-sub { color: var(--text-muted); font-size: 12px; margin-bottom: 14px; }

    /* SECTIONS & BUTTONS */
    .section-title {
      font-size: 13px; font-weight: 900; color: var(--neon-cyan);
      letter-spacing: 1px; margin: 18px 0 12px 0; text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }

    /* QUICK ACCESS CHIPS */
    .categories-flex { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
    .cat-btn {
      background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 16px; border-radius: 20px; color: #fff; font-size: 12px;
      font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.3s;
      backdrop-filter: blur(10px);
    }
    .cat-btn.active, .cat-btn:hover {
      border-color: var(--neon-cyan); color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3); background: rgba(0, 243, 255, 0.1);
    }

    /* PRODUCT GRID & CARDS */
    .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .product-card {
      background: var(--card-bg); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px;
      padding: 14px; display: flex; flex-direction: column; align-items: center;
      text-align: center; transition: all 0.3s ease; position: relative; cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-5px); border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
    }
    .product-badge {
      position: absolute; top: 10px; right: 10px; background: rgba(0, 255, 135, 0.2);
      border: 1px solid var(--neon-green); color: var(--neon-green); font-size: 9px;
      padding: 2px 6px; border-radius: 8px; font-weight: 800;
    }
    .product-img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; margin-bottom: 10px; }
    .product-title { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
    .product-price { color: var(--neon-cyan); font-size: 12px; font-weight: 900; margin-bottom: 10px; }

    /* NEON BUTTONS */
    .neon-btn {
      background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan);
      padding: 8px 14px; border-radius: 10px; font-weight: 900; font-size: 11px;
      cursor: pointer; transition: 0.3s; width: 100%; text-transform: uppercase;
    }
    .neon-btn:hover {
      background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan);
    }

    /* GLASS FORM BOXES */
    .glass-box {
      background: var(--card-bg); backdrop-filter: blur(15px);
      border: 1px solid var(--border-glow); padding: 18px; border-radius: 18px; margin-bottom: 16px;
    }
    .form-group { margin-bottom: 12px; text-align: right; }
    .form-label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px; }
    .form-input {
      width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 13px; outline: none; transition: 0.3s;
    }
    .form-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }

    /* AUTH SWITCH TABS */
    .auth-tabs { display: flex; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 10px; margin-bottom: 14px; }
    .auth-tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-muted); font-weight: 800; font-size: 11px; cursor: pointer; border-radius: 8px; }
    .auth-tab-btn.active { background: rgba(0, 243, 255, 0.2); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }

    /* PACKAGES MODAL */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--card-bg); border: 1px solid var(--neon-cyan);
      border-radius: 20px; padding: 20px; width: 100%; max-width: 400px;
      box-shadow: 0 0 30px rgba(0,243,255,0.3); text-align: center;
    }

    /* PAGES CONTROLLER */
    .page { display: none; }
    .page.active { display: block; animation: pageFade 0.3s ease-out; }
    @keyframes pageFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* FLOATING BOTTOM NAV */
    .bottom-nav {
      position: fixed; bottom: 16px; left: 5%; right: 5%; max-width: 440px; margin: 0 auto;
      background: rgba(10, 10, 18, 0.85); backdrop-filter: blur(20px);
      border: 1px solid var(--border-glow); border-radius: 25px;
      display: flex; justify-content: space-around; padding: 12px 0;
      box-shadow: 0 10px 35px rgba(0,0,0,0.8), 0 0 15px rgba(0, 243, 255, 0.1); z-index: 1000;
    }
    .nav-item { color: var(--text-muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.3s; }
    .nav-item i { font-size: 18px; }
    .nav-item.active { color: var(--neon-cyan); font-weight: bold; filter: drop-shadow(0 0 6px var(--neon-cyan)); }
  </style>
</head>
<body>

  <!-- PWA BANNER -->
  <div id="pwaInstallBanner">
    <div style="display:flex; align-items:center; gap:8px;">
      <i class="fa-solid fa-bolt" style="color:var(--neon-cyan);"></i>
      <span style="font-size:12px; font-weight:800;">تثبيت تطبيق NEON RECHARGE</span>
    </div>
    <button class="install-btn" onclick="installPWA()">تثبيت</button>
  </div>

  <div class="app">
    
    <!-- HEADER -->
    <header>
      <div class="logo" onclick="showPage('homePage', 'nav-homePage')">NEON CHARGE</div>
      <div style="display:flex; gap:14px; align-items:center;">
        <i class="fa-solid fa-cart-shopping header-icon" onclick="showPage('ordersPage', 'nav-ordersPage')"></i>
        <i class="fa-solid fa-user header-icon" onclick="showPage('profilePage', 'nav-profilePage')"></i>
      </div>
    </header>

    <!-- BALANCE DISPLAY CHIP -->
    <div class="balance-chip" id="balanceDisplayBar" style="display: none;">
      <span><i class="fa-solid fa-wallet"></i> رصيد الحساب:</span>
      <strong id="userBalanceText" style="font-size:14px;">$0.00</strong>
    </div>

    <!-- 1. HOME PAGE -->
    <div id="homePage" class="page active">
      <div class="hero-card">
        <div class="hero-title">شحن فورى نيوني ⚡</div>
        <div class="hero-sub">شحن مباشر لكافة الألعاب والبطاقات بأفضل سعر</div>
        <button class="neon-btn" style="width: auto; padding: 8px 20px;" onclick="openGamePackages('PUBG Mobile')">شحن PUBG الآن</button>
      </div>

      <div class="section-title">الأقسام المتاحة</div>
      <div class="categories-flex" id="categoriesContainer">
        <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('PUBG Mobile', this)">PUBG Mobile</button>
        <button class="cat-btn" onclick="filterCategory('Free Fire', this)">Free Fire</button>
        <button class="cat-btn" onclick="filterCategory('TikTok', this)">TikTok</button>
        <button class="cat-btn" onclick="filterCategory('ألعاب', this)">ألعاب أخرى</button>
        <button class="cat-btn" onclick="filterCategory('بطاقات', this)">بطاقات</button>
      </div>

      <div class="section-title">الأكثر مبيعاً 🔥</div>
      <div class="product-grid" id="productsContainer">
        <!-- يتم التعبئة ديناميكياً بواسطة السكربت -->
      </div>
    </div>

    <!-- 2. DEPOSIT PAGE -->
    <div id="depositPage" class="page">
      <div class="glass-box">
        <h3 style="color:var(--neon-cyan); margin-bottom:14px; font-size:15px; text-align:right;">
          <i class="fa-solid fa-plus-circle"></i> طلب إيداع رصيد
        </h3>
        <div class="form-group">
          <label class="form-label">المبلغ المراد إيداعه ($):</label>
          <input type="number" id="depAmount" class="form-input" placeholder="10.00" step="0.1">
        </div>
        <div class="form-group">
          <label class="form-label">صورة إثبات التحويل (Screenshot):</label>
          <input type="file" id="depFile" class="form-input" accept="image/*">
        </div>
        <button class="neon-btn" style="margin-top:10px;" onclick="submitDeposit()">إرسال طلب الإيداع</button>
      </div>
    </div>

    <!-- 3. ORDERS PAGE -->
    <div id="ordersPage" class="page">
      <div class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> سجل عملياتك</div>
      <div id="myOrdersList">جاري تحميل البيانات...</div>
    </div>

    <!-- 4. PROFILE / AUTH PAGE -->
    <div id="profilePage" class="page">
      <div class="glass-box" id="authBox">
        <h3 style="color:var(--neon-cyan); margin-bottom:14px; text-align:center; font-size:15px;">تسجيل الدخول / إنشاء حساب</h3>
        
        <button class="neon-btn" style="background: rgba(255,255,255,0.05); color:#fff; border-color:rgba(255,255,255,0.2); margin-bottom:12px;" onclick="loginWithGoogle()">
          <i class="fa-brands fa-google" style="color:#ea4335;"></i> الدخول بـ Google
        </button>

        <div class="auth-tabs">
          <button class="auth-tab-btn active" id="tabEmailBtn" onclick="switchAuthTab('email')">الإيميل</button>
          <button class="auth-tab-btn" id="tabPhoneBtn" onclick="switchAuthTab('phone')">رقم الهاتف</button>
        </div>

        <!-- EMAIL FORM -->
        <div id="emailAuthForm">
          <div class="form-group">
            <label class="form-label">البريد الإلكتروني:</label>
            <input type="email" id="authEmail" class="form-input" placeholder="name@example.com">
          </div>
          <div class="form-group">
            <label class="form-label">كلمة المرور:</label>
            <input type="password" id="authPass" class="form-input" placeholder="••••••••">
          </div>
          <button class="neon-btn" onclick="loginWithEmail()">دخول</button>
          <button class="neon-btn" style="border-color:var(--neon-purple); color:var(--neon-purple); margin-top:8px;" onclick="signUpWithEmail()">تسجيل جديد</button>
        </div>

        <!-- PHONE OTP FORM -->
        <div id="phoneAuthForm" style="display:none;">
          <div id="phoneStep1">
            <div class="form-group">
              <label class="form-label">رقم الهاتف (كود الدولة):</label>
              <input type="tel" id="authPhone" class="form-input" placeholder="+201000000000">
            </div>
            <button class="neon-btn" onclick="sendPhoneOTP()">إرسال رمز OTP</button>
          </div>
          <div id="phoneStep2" style="display:none;">
            <div class="form-group">
              <label class="form-label">رمز التحقق:</label>
              <input type="text" id="authOtp" class="form-input" placeholder="123456">
            </div>
            <button class="neon-btn" onclick="verifyPhoneOTP()">تأكيد والدخول</button>
          </div>
        </div>
      </div>

      <!-- USER INFO -->
      <div class="glass-box" id="userInfoBox" style="display:none; text-align:right;">
        <h3 style="color:var(--neon-cyan); margin-bottom:8px;"><i class="fa-solid fa-circle-check"></i> مرحباً بك</h3>
        <p id="userEmailDisplay" style="font-size:13px; margin:8px 0; color:var(--text-muted);"></p>
        <button class="neon-btn" style="border-color:#ff4757; color:#ff4757; margin-top:12px;" onclick="logout()"><i class="fa-solid fa-power-off"></i> تسجيل الخروج</button>
      </div>
    </div>

  </div>

  <!-- PACKAGES MODAL (نافذة عرض باقات الألعاب المحددة) -->
  <div class="modal-overlay" id="packagesModal">
    <div class="modal-card">
      <h3 id="modalGameTitle" style="color:var(--neon-cyan); margin-bottom:15px; font-size:16px;">الباقات المتاحة</h3>
      <div id="packagesList" style="display:grid; gap:10px; max-height:300px; overflow-y:auto; margin-bottom:15px;"></div>
      <button class="neon-btn" style="border-color:#ff4757; color:#ff4757;" onclick="closeModal()">إغلاق</button>
    </div>
  </div>

  <!-- BOTTOM FLOATING NAV -->
  <nav class="bottom-nav">
    <div class="nav-item active" id="nav-homePage" onclick="showPage('homePage', 'nav-homePage')">
      <i class="fa-solid fa-house"></i>الرئيسية
    </div>
    <div class="nav-item" id="nav-depositPage" onclick="showPage('depositPage', 'nav-depositPage')">
      <i class="fa-solid fa-plus-circle"></i>الإيداع
    </div>
    <div class="nav-item" id="nav-ordersPage" onclick="showPage('ordersPage', 'nav-ordersPage')">
      <i class="fa-solid fa-receipt"></i>طلباتي
    </div>
    <div class="nav-item" id="nav-profilePage" onclick="showPage('profilePage', 'nav-profilePage')">
      <i class="fa-solid fa-user"></i>حسابي
    </div>
  </nav>

  <script>
    // Supabase Setup
    const SUPABASE_URL = "https://naeixfkhzshmurxxxpsc.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_S2agsMVWE9wdPEZkiPUKrg_2ITMsiGd"; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let deferredPrompt = null;
    let allProducts = [];
    let currentCategory = 'الكل';

    // PWA Prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwaInstallBanner').style.display = 'flex';
    });

    async function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
        document.getElementById('pwaInstallBanner').style.display = 'none';
      }
    }

    // Page Router
    function showPage(pageId, navId) {
      const protectedPages = ['depositPage', 'ordersPage'];
      if (!currentUser && protectedPages.includes(pageId)) {
        alert("يرجى تسجيل الدخول أولاً للوصول لهذه الصفحة!");
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('profilePage').classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('nav-profilePage').classList.add('active');
        return;
      }

      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');

      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      if(navId) document.getElementById(navId).classList.add('active');
    }

    function switchAuthTab(type) {
      document.getElementById('emailAuthForm').style.display = (type === 'email') ? 'block' : 'none';
      document.getElementById('phoneAuthForm').style.display = (type === 'phone') ? 'block' : 'none';
      document.getElementById('tabEmailBtn').classList.toggle('active', type === 'email');
      document.getElementById('tabPhoneBtn').classList.toggle('active', type === 'phone');
    }

    // Authentication Checks
    async function checkAuth() {
      const { data: { user } } = await _supabase.auth.getUser();
      currentUser = user;

      if (user) {
        document.getElementById('authBox').style.display = 'none';
        document.getElementById('userInfoBox').style.display = 'block';
        document.getElementById('balanceDisplayBar').style.display = 'flex';
        document.getElementById('userEmailDisplay').innerText = user.email || user.phone || "مستخدم مسجل";
        loadBalance();
        loadOrders();
        checkAdminRole(user.id);
      } else {
        document.getElementById('authBox').style.display = 'block';
        document.getElementById('userInfoBox').style.display = 'none';
        document.getElementById('balanceDisplayBar').style.display = 'none';
      }
    }

    async function checkAdminRole(userId) {
      const { data: profile } = await _supabase.from('profiles').select('role').eq('id', userId).single();
      if (profile && profile.role === 'admin') {
        const btn = document.createElement('button');
        btn.className = 'neon-btn';
        btn.style.marginTop = '10px';
        btn.style.borderColor = 'var(--neon-purple)';
        btn.style.color = 'var(--neon-purple)';
        btn.innerText = 'لوحة تحكم الأدمن 👑';
        btn.onclick = () => window.location.href = 'admin.html';
        document.getElementById('userInfoBox').appendChild(btn);
      }
    }

    // Auth Handlers
    async function loginWithGoogle() {
      await _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
    }

    async function loginWithEmail() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value;
      const { error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) alert(error.message); else location.reload();
    }

    async function signUpWithEmail() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value;
      const { error } = await _supabase.auth.signUp({ email, password });
      if (error) alert(error.message); else alert("تم إنشاء الحساب بنجاح!");
    }

    async function sendPhoneOTP() {
      const phone = document.getElementById('authPhone').value.trim();
      const { error } = await _supabase.auth.signInWithOtp({ phone });
      if (error) alert(error.message);
      else {
        alert("تم إرسال الرمز عبر SMS!");
        document.getElementById('phoneStep1').style.display = 'none';
        document.getElementById('phoneStep2').style.display = 'block';
      }
    }

    async function verifyPhoneOTP() {
      const phone = document.getElementById('authPhone').value.trim();
      const token = document.getElementById('authOtp').value.trim();
      const { error } = await _supabase.auth.verifyOtp({ phone, token, type: 'sms' });
      if (error) alert(error.message); else location.reload();
    }

    async function logout() {
      await _supabase.auth.signOut();
      location.reload();
    }

    // Products & Filtering
    async function loadProducts() {
      const { data: products } = await _supabase.from('products').select('*');
      allProducts = products || [];
      renderProducts();
    }

    function filterCategory(catName, el) {
      currentCategory = catName;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      if(el) el.classList.add('active');
      renderProducts();
    }

    function renderProducts() {
      const container = document.getElementById('productsContainer');
      const filtered = currentCategory === 'الكل' 
        ? allProducts 
        : allProducts.filter(p => p.category === currentCategory);

      if (filtered.length === 0) {
        // العرض الافتراضي في حالة عدم إضافة منتجات بعد من الأدمن
        container.innerHTML = `
          <div class="product-card" onclick="openGamePackages('PUBG Mobile')">
            <span class="product-badge">BEST</span>
            <img src="https://cdn-icons-png.flaticon.com/512/3738/3738567.png" class="product-img">
            <div class="product-title">PUBG Mobile</div>
            <div class="product-price">باقات شدات UC</div>
            <button class="neon-btn">عرض الباقات</button>
          </div>
          <div class="product-card" onclick="openGamePackages('Free Fire')">
            <span class="product-badge">HOT</span>
            <img src="https://cdn-icons-png.flaticon.com/512/808/808436.png" class="product-img">
            <div class="product-title">Free Fire</div>
            <div class="product-price">باقات جواهر</div>
            <button class="neon-btn">عرض الباقات</button>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div class="product-card" onclick="openGamePackages('${p.category || p.title}')">
          <span class="product-badge">${p.badge || 'PROMO'}</span>
          <img src="${p.image_url}" class="product-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3738/3738567.png'">
          <div class="product-title">${p.title}</div>
          <div class="product-price">${parseFloat(p.price || 0).toFixed(2)} USD</div>
          <button class="neon-btn" onclick="event.stopPropagation(); buyProduct('${p.title}', ${p.price || 0})">شحن مباشر</button>
        </div>
      `).join('');
    }

    // Modal Packages Control (فتح باقات الألعاب المحددة مثل PUBG UC)
    async function openGamePackages(gameCategory) {
      document.getElementById('modalGameTitle').innerText = `باقات ${gameCategory}`;
      const list = document.getElementById('packagesList');
      list.innerHTML = '<p style="font-size:12px; color:var(--text-muted);">جاري التحميل...</p>';
      document.getElementById('packagesModal').classList.add('active');

      const { data: packages } = await _supabase.from('products').select('*').or(`category.eq.${gameCategory},title.ilike.%${gameCategory}%`);

      if (!packages || packages.length === 0) {
        list.innerHTML = '<p style="font-size:12px; color:var(--text-muted);">لا توجد باقات مضافة لهذا القسم حالياً.</p>';
        return;
      }

      list.innerHTML = packages.map(pkg => `
        <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:12px; display:flex; justify-content:space-between; align-items:center;">
          <div style="text-align:right;">
            <div style="font-weight:800; font-size:13px;">${pkg.title}</div>
            <div style="color:var(--neon-cyan); font-weight:900; font-size:12px;">$${parseFloat(pkg.price || 0).toFixed(2)} USD</div>
          </div>
          <button class="neon-btn" style="width:auto;" onclick="buyProduct('${pkg.title}', ${pkg.price})">شحن الآن</button>
        </div>
      `).join('');
    }

    function closeModal() {
      document.getElementById('packagesModal').classList.remove('active');
    }

    // Orders & Deposits Handlers
    async function loadBalance() {
      if (!currentUser) return;
      const { data } = await _supabase.from('profiles').select('balance').eq('id', currentUser.id).single();
      if (data && data.balance !== undefined) {
        document.getElementById('userBalanceText').innerText = `$${parseFloat(data.balance).toFixed(2)}`;
      }
    }

    async function buyProduct(title, price = 0) {
      if (!currentUser) {
        alert("يرجى تسجيل الدخول أولاً للتمكن من الشراء!");
        showPage('profilePage', 'nav-profilePage');
        return;
      }

      const playerId = prompt(`أدخل الـ ID الخاص بك لـ (${title}):`);
      if (!playerId) return;

      const { error } = await _supabase.from('orders').insert([{
        user_id: currentUser.id,
        game_name: title,
        player_id: playerId,
        package_name: title,
        price: price,
        order_type: 'charge'
      }]);

      if (error) alert(error.message);
      else {
        alert("تم إرسال طلب الشحن بنجاح!");
        closeModal();
        showPage('ordersPage', 'nav-ordersPage');
        loadOrders();
      }
    }

    async function submitDeposit() {
      if (!currentUser) return alert("سجل دخول أولاً!");

      const amount = document.getElementById('depAmount').value;
      const fileInput = document.getElementById('depFile');

      if (!amount || fileInput.files.length === 0) return alert("يرجى إدخال المبلغ وإرفاق صورة الإثبات!");

      const file = fileInput.files[0];
      const fileName = `${Date.now()}_${file.name}`;
      
      const { error: uploadErr } = await _supabase.storage.from('receipts').upload(fileName, file);
      if (uploadErr) return alert("فشل رفع الصورة: " + uploadErr.message);

      const { data: publicUrl } = _supabase.storage.from('receipts').getPublicUrl(fileName);

      const { error } = await _supabase.from('orders').insert([{
        user_id: currentUser.id,
        game_name: 'إيداع رصيد',
        player_id: currentUser.email || currentUser.phone,
        package_name: `إيداع بقيمة $${amount}`,
        price: parseFloat(amount),
        order_type: 'deposit',
        receipt_url: publicUrl.publicUrl
      }]);

      if (error) alert(error.message);
      else {
        alert("تم إرسال طلب الإيداع بنجاح!");
        showPage('ordersPage', 'nav-ordersPage');
        loadOrders();
      }
    }

    async function loadOrders() {
      if (!currentUser) return;
      const { data: orders } = await _supabase.from('orders').select('*').eq('user_id', currentUser.id).order('id', { ascending: false });
      const list = document.getElementById('myOrdersList');
      
      if (!orders || orders.length === 0) {
        return list.innerHTML = '<div class="glass-box" style="color:var(--text-muted); font-size:12px; text-align:center;">لا توجد طلبات سابقة.</div>';
      }

      list.innerHTML = orders.map(o => `
        <div class="glass-box" style="text-align:right;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="font-size:13px;">${o.game_name}</strong>
            <span style="color:var(--neon-green); font-weight:800;">$${parseFloat(o.price || 0).toFixed(2)}</span>
          </div>
          <div style="font-size:11px; color:var(--text-muted); margin-top:8px; display:flex; justify-content:space-between;">
            <span>الحالة: <strong style="color:var(--neon-cyan);">${o.status || 'قيد الانتظار'}</strong></span>
            <span>${o.package_name || ''}</span>
          </div>
        </div>
      `).join('');
    }

    // Initialize
    checkAuth();
    loadProducts();
  </script>
</body>
</html>
